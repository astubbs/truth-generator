# Publishes to Maven Central (Sonatype Central Portal) after CI passes on master.
#
# The pom.xml version is the source of truth:
#   - Versions ending in -SNAPSHOT  -> publish snapshot
#   - Versions without -SNAPSHOT    -> publish release + create git tag + GitHub release
#
# To cut a release: open a PR that strips -SNAPSHOT, merge it. CI will publish.
# Then open another PR bumping to the next -SNAPSHOT. See RELEASING.md.
#
# Required GitHub secrets:
#   MAVEN_CENTRAL_USERNAME   - Sonatype Central Portal token username
#   MAVEN_CENTRAL_PASSWORD   - Sonatype Central Portal token password
#   MAVEN_GPG_PRIVATE_KEY    - Armored GPG private key (gpg --export-secret-keys --armor KEYID)
#   MAVEN_GPG_PASSPHRASE     - Passphrase for the GPG key

name: Publish

on:
  # Only publish after CI passes - workflow_run fires when "CI" completes
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch: # allow manual re-runs

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

permissions:
  contents: write # needed to create tags and releases

jobs:
  publish:
    name: Publish
    # Skip if CI failed (workflow_run fires on both success and failure)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need full history for tag creation

      - name: Setup JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: zulu
          cache: maven
          # Configure Maven settings.xml with Sonatype Central credentials and import the GPG key.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
            echo "Detected SNAPSHOT version: $VERSION"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
            echo "Detected RELEASE version: $VERSION"
          fi

      - name: Check tag does not exist (releases only)
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - aborting to prevent re-release"
            exit 1
          fi

      - name: Deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # central-publishing-maven-plugin handles both snapshots and releases:
          # snapshots PUT directly to the Central Portal snapshot endpoint;
          # releases bundle, validate, and auto-publish via the Portal API.
          # Requires SNAPSHOT publishing enabled on the namespace in
          # central.sonatype.com/publishing/namespaces.
          # -pl exclusion: the integration-tests module is test-only, not a
          # library artifact; skip it from the deploy reactor.
          mvn --batch-mode \
            -Pmaven-central \
            -pl '!:truth-generator-integration-tests' \
            clean deploy \
            -DskipTests -DskipITs

      - name: Create git tag (releases only)
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release from Release Drafter draft (releases only)
        # Publishes the draft that release-drafter has been accumulating from merged
        # PRs (categorised notes, incl. the "Breaking Changes" section) against the
        # new tag - rather than GitHub's flat auto-generated commit list.
        if: steps.version.outputs.is_snapshot == 'false'
        uses: release-drafter/release-drafter@5de93583980a40bd78603b6dfdcda5b4df377b32 # v7.2.0
        with:
          publish: true
          tag: v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
